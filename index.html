<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff1f6d" />
  <meta name="description" content="Galactus — Outil compta interne TDM studio + vu.media" />

  <title>Galactus</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Galactus" />

  <!-- Google Fonts (Inter / Big Shoulders Display / JetBrains Mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Big+Shoulders+Display:wght@700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" />

  <!-- Tailwind CDN (warning prod accepté MVP — voir PROJET_galactus.md ERREURS CONNUES) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: '#fffdf6',
            soft: '#fbf8ec',
            fill: '#f4f0de',
            rule: '#d9d4be',
            faint: '#a6a18a',
            mid: '#6f6b58',
            ink: '#1e1d18',
            void: '#0a0a1f',
            cosmos: '#050513',
            accent: '#ff1f6d',
            'accent-soft': '#ff5f9c',
            hot: '#ff4d3d',
            violet: '#8b3dff',
            cyan: '#00d4ff',
            gold: '#ffc857',
            orange: '#ff8c42',
            green: '#00e676',
            amber: '#ffb300',
            red: '#ff3838',
            blue: '#3b82f6',
            yellow: '#fde047',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['"Big Shoulders Display"', 'Inter', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
          },
          boxShadow: {
            'glow-accent': '0 0 14px #ff1f6daa, 0 0 30px #8b3dff66',
          },
          backgroundImage: {
            nebula:
              'radial-gradient(ellipse at 20% 10%, rgba(139,61,255,0.35) 0%, transparent 50%), radial-gradient(ellipse at 80% 80%, rgba(255,31,109,0.30) 0%, transparent 55%), radial-gradient(ellipse at 50% 50%, rgba(0,212,255,0.15) 0%, transparent 60%), linear-gradient(180deg, #050513 0%, #0a0a1f 100%)',
          },
        },
      },
    };
  </script>

  <!-- CSS Galactus (variables, nebula, badges, animations) -->
  <link rel="stylesheet" href="css/galactus.css" />

  <!-- Supabase UMD (window.supabase) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Config Galactus (injectée AVANT app.js) -->
  <script>
    window.GALACTUS_CONFIG = {
      SUPABASE_URL: 'https://eqlofgcravaihvfaysdb.supabase.co',
      SUPABASE_ANON_KEY: 'sb_publishable_VVk6FxIPWh5dNDgVAAVf1Q_3n5mE-B2'
    };
  </script>

  <!-- App modules ES (app.js importe utils.js + supabase.js) -->
  <script type="module" src="js/app.js"></script>

  <!-- Vue Ingestion Sprint 2 (window.ingestion + composant Alpine) -->
  <script type="module" src="js/ingestion.js"></script>

  <!-- Vues Sprint 3 (window.pieces / window.dashboard) -->
  <script type="module" src="js/pieces.js"></script>
  <script type="module" src="js/dashboard.js"></script>

  <!-- pdf-lib UMD pour conversion image→PDF + concat multi-pages (Sprint 2) -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

  <!-- Alpine.js (defer assure exécution après app.js qui définit window.app) -->
  <script defer src="https://unpkg.com/alpinejs@3.13.5/dist/cdn.min.js"></script>
</head>

<body x-data="app()" x-init="init()" x-cloak class="bg-paper text-ink min-h-screen">

  <!-- ====================================================================== -->
  <!-- === LOGIN OVERLAY (visible si !isAuthed) =============================== -->
  <!-- ====================================================================== -->
  <div x-show="!isAuthed" x-transition.opacity
       class="fixed inset-0 z-50 flex items-center justify-center overflow-hidden">
    <div class="absolute inset-0 nebula-gradient"></div>
    <div class="absolute inset-0 star-field opacity-50 pointer-events-none"></div>

    <div class="relative bg-paper border-2 border-ink rounded-lg p-7 w-[360px] max-w-[92vw] shadow-2xl">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-11 h-11 rounded-full logo-halo accent-glow"></div>
        <div>
          <div class="font-display font-black text-[28px] leading-none uppercase">GALACTUS</div>
          <div class="font-mono text-[8px] uppercase tracking-widest text-orange mt-1">Dévoreur de factures</div>
        </div>
      </div>

      <form @submit.prevent="login()" class="flex flex-col gap-4">
        <div class="flex flex-col gap-1">
          <label class="text-[11px] font-mono uppercase tracking-wider text-mid">Email</label>
          <input x-model="loginEmail" type="email" autocomplete="email" required
                 class="border-[1.5px] border-ink rounded-sm px-3 py-2 font-mono text-sm bg-paper focus:outline-none focus:border-accent" />
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-[11px] font-mono uppercase tracking-wider text-mid">Mot de passe</label>
          <input x-model="loginPassword" type="password" autocomplete="current-password" required
                 class="border-[1.5px] border-ink rounded-sm px-3 py-2 font-mono text-sm bg-paper focus:outline-none focus:border-accent" />
        </div>

        <div x-show="loginError" x-text="loginError"
             class="text-red text-xs font-mono"></div>

        <button type="submit" :disabled="loading"
                class="bg-gradient-to-b from-hot to-accent text-white font-bold uppercase tracking-wider px-5 py-3 rounded shadow-glow-accent border-[1.5px] border-ink mt-2 disabled:opacity-50">
          <span x-show="!loading">Se connecter</span>
          <span x-show="loading">Connexion…</span>
        </button>
      </form>

      <div class="mt-4 font-mono text-[9px] text-faint text-center uppercase tracking-wider">
        Compte Pierre unique · MVP single-user
      </div>
    </div>
  </div>

  <!-- ====================================================================== -->
  <!-- === APP (visible si isAuthed) ========================================== -->
  <!-- ====================================================================== -->
  <div x-show="isAuthed" x-cloak class="min-h-screen">

    <!-- ============== SIDEBAR DESKTOP (≥ md) ============== -->
    <aside class="hidden md:flex md:flex-col md:w-[220px] md:fixed md:h-screen md:z-30 nebula-gradient relative">
      <div class="absolute inset-0 star-field opacity-40 pointer-events-none"></div>

      <div class="relative p-5">
        <!-- Logo + brand -->
        <div class="flex items-center gap-3 mb-8">
          <div class="w-[22px] h-[22px] rounded-full logo-halo"></div>
          <div>
            <div class="font-display font-black text-[30px] leading-none text-white uppercase">GALACTUS</div>
            <div class="font-mono text-[8px] uppercase tracking-widest text-gold mt-1">Dévoreur de factures</div>
          </div>
        </div>

        <!-- Nav items (4) -->
        <nav class="flex flex-col gap-1 text-left">
          <!-- Ingestion -->
          <button @click="navigate('ingestion')"
                  :class="currentView === 'ingestion' ? 'bg-gradient-to-r from-accent/30 to-transparent border-l-4 border-accent' : 'border-l-4 border-transparent hover:bg-white/5'"
                  class="px-3 py-3 transition-colors">
            <div class="flex items-center justify-between">
              <span class="font-display font-bold text-base text-white uppercase">Ingestion</span>
              <span x-show="currentView === 'ingestion'" class="w-2 h-2 rounded-full bg-accent accent-glow"></span>
            </div>
            <div class="font-mono text-[9px] text-faint uppercase tracking-wider mt-0.5">Photo · Fichier · Batch</div>
          </button>

          <!-- Dashboard -->
          <button @click="navigate('dashboard')"
                  :class="currentView === 'dashboard' ? 'bg-gradient-to-r from-accent/30 to-transparent border-l-4 border-accent' : 'border-l-4 border-transparent hover:bg-white/5'"
                  class="px-3 py-3 transition-colors">
            <div class="flex items-center justify-between">
              <span class="font-display font-bold text-base text-white uppercase">Dashboard</span>
              <span x-show="currentView === 'dashboard'" class="w-2 h-2 rounded-full bg-accent accent-glow"></span>
            </div>
            <div class="font-mono text-[9px] text-faint uppercase tracking-wider mt-0.5">Mois · Année · KPI</div>
          </button>

          <!-- Pièces -->
          <button @click="navigate('pieces')"
                  :class="currentView === 'pieces' ? 'bg-gradient-to-r from-accent/30 to-transparent border-l-4 border-accent' : 'border-l-4 border-transparent hover:bg-white/5'"
                  class="px-3 py-3 transition-colors">
            <div class="flex items-center justify-between">
              <span class="font-display font-bold text-base text-white uppercase">Pièces</span>
              <span x-show="currentView === 'pieces'" class="w-2 h-2 rounded-full bg-accent accent-glow"></span>
            </div>
            <div class="font-mono text-[9px] text-faint uppercase tracking-wider mt-0.5">Fournisseurs · NDF · Mat</div>
          </button>

          <!-- Exports -->
          <button @click="navigate('exports')"
                  :class="currentView === 'exports' ? 'bg-gradient-to-r from-accent/30 to-transparent border-l-4 border-accent' : 'border-l-4 border-transparent hover:bg-white/5'"
                  class="px-3 py-3 transition-colors">
            <div class="flex items-center justify-between">
              <span class="font-display font-bold text-base text-white uppercase">Exports</span>
              <span x-show="currentView === 'exports'" class="w-2 h-2 rounded-full bg-accent accent-glow"></span>
            </div>
            <div class="font-mono text-[9px] text-faint uppercase tracking-wider mt-0.5">Indy · NDF mois · CA3</div>
          </button>
        </nav>
      </div>

      <!-- Footer user -->
      <div class="mt-auto relative p-5">
        <div class="flex items-center gap-2 text-white">
          <div class="w-7 h-7 rounded-full bg-gold text-ink font-display font-black flex items-center justify-center text-sm">P</div>
          <div class="font-mono text-[10px] text-faint truncate max-w-[140px]" x-text="user?.email || ''"></div>
        </div>
        <button @click="logout()"
                class="mt-2 text-[10px] font-mono text-mid hover:text-white uppercase tracking-wider">Déconnexion</button>
      </div>
    </aside>

    <!-- ============== TAB BAR MOBILE (< md) ============== -->
    <!-- Masquée en mode rafale (Sprint 2) — voir Alpine.store('app').rafaleMode -->
    <nav x-show="!($store.app && $store.app.rafaleMode)"
         class="md:hidden fixed bottom-0 left-0 right-0 z-30 bg-paper border-t-2 border-ink flex items-center justify-around px-2 py-2"
         style="padding-bottom: max(0.5rem, env(safe-area-inset-bottom));">

      <!-- Dashboard -->
      <button @click="navigate('dashboard')" class="flex flex-col items-center gap-1 px-3 py-1">
        <div class="w-[22px] h-[22px] rounded-sm border-2 border-ink flex items-center justify-center">
          <div class="w-[10px] h-[10px] bg-ink rounded-[1px]"></div>
        </div>
        <span class="font-mono text-[9px] uppercase tracking-wider"
              :class="currentView === 'dashboard' ? 'text-accent font-bold' : 'text-mid'">Dashboard</span>
      </button>

      <!-- Ingestion (PILL PROÉMINENT) -->
      <button @click="navigate('ingestion')" class="flex flex-col items-center gap-1 px-3 py-1">
        <div class="w-[36px] h-[22px] rounded-full bg-gradient-to-b from-hot to-accent border-2 border-ink shadow-glow-accent flex items-center justify-center">
          <span class="text-white text-[10px] font-black leading-none">+</span>
        </div>
        <span class="font-mono text-[9px] uppercase tracking-wider font-bold"
              :class="currentView === 'ingestion' ? 'text-accent' : 'text-ink'">Ingestion</span>
      </button>

      <!-- Pièces -->
      <button @click="navigate('pieces')" class="flex flex-col items-center gap-1 px-3 py-1">
        <div class="w-[22px] h-[22px] rounded-sm border-2 border-ink grid grid-cols-2 gap-[1px] p-[2px]">
          <div class="bg-ink"></div><div class="bg-ink"></div>
          <div class="bg-ink"></div><div class="bg-ink"></div>
        </div>
        <span class="font-mono text-[9px] uppercase tracking-wider"
              :class="currentView === 'pieces' ? 'text-accent font-bold' : 'text-mid'">Pièces</span>
      </button>

      <!-- Exports -->
      <button @click="navigate('exports')" class="flex flex-col items-center gap-1 px-3 py-1">
        <div class="w-[22px] h-[22px] rounded-sm border-2 border-ink flex items-end justify-center pb-[2px]">
          <div class="w-[10px] h-[2px] bg-ink"></div>
        </div>
        <span class="font-mono text-[9px] uppercase tracking-wider"
              :class="currentView === 'exports' ? 'text-accent font-bold' : 'text-mid'">Exports</span>
      </button>
    </nav>

    <!-- ============== MAIN CONTENT (4 vues + démo) ============== -->
    <main class="md:ml-[220px] min-h-screen pb-24 md:pb-8">

      <!-- =================== VUE INGESTION (Sprint 2) =================== -->
      <template x-if="currentView === 'ingestion'">
        <section x-data="ingestion()" x-init="init()">

          <!-- ============== HEADER RAFALE (mobile + desktop) ============== -->
          <div x-show="isRafale" x-cloak
               class="bg-ink text-paper px-5 md:px-8 py-2 flex items-center justify-between sticky top-0 z-20">
            <div class="font-mono text-xs uppercase tracking-wider">
              <span class="text-gold font-bold">RAFALE</span>
              · <span x-text="rafaleCount"></span> pièce<span x-text="rafaleCount > 1 ? 's' : ''"></span> validée<span x-text="rafaleCount > 1 ? 's' : ''"></span>
            </div>
            <button @click="exitRafale(); resetForm(); subview = 'home';"
                    class="text-[10px] font-mono uppercase tracking-wider text-accent hover:text-accent-soft">Sortir</button>
          </div>

          <!-- ====================================================== -->
          <!-- === SUBVIEW HOME ====================================== -->
          <!-- ====================================================== -->
          <div x-show="subview === 'home'" x-cloak>

            <!-- ============== MOBILE ============== -->
            <div class="md:hidden p-5 flex flex-col min-h-[calc(100vh-180px)]">
              <header class="mb-6">
                <h1 class="font-display font-black text-4xl uppercase">INGESTION</h1>
                <p class="font-mono text-[11px] uppercase tracking-wider text-mid mt-1">Photo · Fichier</p>
              </header>

              <div class="flex-1 flex flex-col gap-4 justify-center">
                <!-- Bouton Photo (caméra arrière) -->
                <button @click="capturePhoto()"
                        class="bg-gradient-to-b from-hot to-accent text-white border-2 border-ink rounded-lg p-6 shadow-glow-accent flex flex-col items-center gap-2">
                  <span class="text-4xl leading-none">📷</span>
                  <span class="font-display font-black text-xl uppercase">Prendre en photo</span>
                  <span class="font-mono text-[9px] uppercase tracking-wider opacity-80">Caméra arrière · JPG/PNG</span>
                </button>
                <input type="file" accept="image/jpeg,image/png" capture="environment" multiple hidden
                       x-ref="cameraInput" @change="onFilesSelected($event)" />

                <!-- Bouton Fichier -->
                <button @click="pickFile()"
                        class="bg-paper text-ink border-2 border-ink rounded-lg p-6 flex flex-col items-center gap-2">
                  <span class="text-4xl leading-none">📎</span>
                  <span class="font-display font-black text-xl uppercase">Choisir un fichier</span>
                  <span class="font-mono text-[9px] uppercase tracking-wider text-mid">PDF · JPG · PNG</span>
                </button>
                <input type="file" accept="image/jpeg,image/png,application/pdf" multiple hidden
                       x-ref="fileInput" @change="onFilesSelected($event)" />
              </div>

              <!-- Pages ajoutées (multi-pages avant OCR) -->
              <div x-show="pages.length > 0" x-cloak
                   class="mt-6 border-2 border-ink rounded-lg p-4 bg-soft">
                <div class="font-mono text-[10px] uppercase tracking-wider text-mid mb-2">
                  <span x-text="pages.length"></span> page<span x-text="pages.length > 1 ? 's' : ''"></span> ajoutée<span x-text="pages.length > 1 ? 's' : ''"></span>
                </div>
                <div class="flex flex-wrap gap-2 mb-3">
                  <template x-for="(p, i) in pages" :key="i">
                    <div class="relative w-14 h-14 border border-rule rounded bg-paper overflow-hidden">
                      <template x-if="p.mediaType !== 'application/pdf'">
                        <img :src="p.previewUrl" class="w-full h-full object-cover" />
                      </template>
                      <template x-if="p.mediaType === 'application/pdf'">
                        <div class="w-full h-full flex items-center justify-center font-mono text-[9px] text-mid">PDF</div>
                      </template>
                      <button @click="removePage(i)"
                              class="absolute -top-1 -right-1 w-4 h-4 bg-red text-white rounded-full text-[10px] leading-none flex items-center justify-center">×</button>
                    </div>
                  </template>
                </div>
                <div class="flex gap-2">
                  <button @click="resetForm()"
                          class="flex-1 border-[1.5px] border-rule rounded px-3 py-2 font-mono text-[11px] uppercase tracking-wider text-mid hover:text-ink">Annuler</button>
                  <button @click="addPage()"
                          class="flex-1 border-[1.5px] border-ink rounded px-3 py-2 font-mono text-[11px] uppercase tracking-wider text-ink">+ Page</button>
                  <button @click="startOCR()"
                          class="flex-[2] bg-gradient-to-b from-hot to-accent text-white border-[1.5px] border-ink rounded px-3 py-2 font-mono text-[11px] uppercase tracking-wider font-bold shadow-glow-accent">Lancer OCR →</button>
                </div>
              </div>
            </div>

            <!-- ============== DESKTOP ============== -->
            <div class="hidden md:flex min-h-[calc(100vh-80px)]">
              <!-- Drop zone gauche -->
              <div class="flex-1 nebula-gradient relative flex items-center justify-center p-10"
                   @dragover.prevent
                   @drop.prevent="onDrop($event)">
                <div class="absolute inset-0 star-field opacity-30 pointer-events-none"></div>

                <div class="relative max-w-2xl w-full text-center text-white">
                  <h1 class="font-display font-black text-6xl uppercase leading-none mb-3">Donne-moi une facture.</h1>
                  <p class="font-mono text-xs uppercase tracking-widest text-gold mb-8">Glisse ici · ou clique ci-dessous</p>

                  <div class="border-2 border-dashed border-accent rounded-2xl p-12 bg-cosmos/40 flex flex-col items-center gap-4">
                    <div class="text-6xl">🌀</div>
                    <div class="flex gap-3">
                      <button @click="pickFile()"
                              class="bg-gradient-to-b from-hot to-accent text-white border-[1.5px] border-paper px-5 py-3 rounded font-bold uppercase tracking-wider text-sm shadow-glow-accent">📎 Choisir un fichier</button>
                    </div>
                    <div class="font-mono text-[10px] uppercase tracking-wider text-faint">PDF · JPG · PNG · multi-fichiers OK</div>
                  </div>

                  <!-- Pages ajoutées desktop -->
                  <div x-show="pages.length > 0" x-cloak
                       class="mt-6 bg-paper text-ink rounded-lg p-4 flex items-center gap-4">
                    <div class="font-mono text-xs uppercase tracking-wider">
                      <span x-text="pages.length"></span> page<span x-text="pages.length > 1 ? 's' : ''"></span>
                    </div>
                    <div class="flex gap-2 flex-1">
                      <template x-for="(p, i) in pages" :key="i">
                        <div class="relative w-12 h-12 border border-rule rounded bg-soft overflow-hidden">
                          <template x-if="p.mediaType !== 'application/pdf'">
                            <img :src="p.previewUrl" class="w-full h-full object-cover" />
                          </template>
                          <template x-if="p.mediaType === 'application/pdf'">
                            <div class="w-full h-full flex items-center justify-center font-mono text-[9px] text-mid">PDF</div>
                          </template>
                          <button @click="removePage(i)"
                                  class="absolute -top-1 -right-1 w-4 h-4 bg-red text-white rounded-full text-[10px] leading-none flex items-center justify-center">×</button>
                        </div>
                      </template>
                    </div>
                    <button @click="resetForm()"
                            class="border-[1.5px] border-rule rounded px-3 py-2 font-mono text-[11px] uppercase tracking-wider text-mid hover:text-ink">Annuler</button>
                    <button @click="addPage()"
                            class="border-[1.5px] border-ink rounded px-3 py-2 font-mono text-[11px] uppercase tracking-wider">+ Page</button>
                    <button @click="startOCR()"
                            class="bg-gradient-to-b from-hot to-accent text-white border-[1.5px] border-ink rounded px-4 py-2 font-mono text-[11px] uppercase tracking-wider font-bold shadow-glow-accent">Lancer OCR →</button>
                  </div>
                </div>
              </div>

              <!-- Panel droite : File OCR (placeholder Sprint 3) -->
              <aside class="w-[340px] bg-paper border-l-2 border-ink p-5 flex flex-col">
                <div class="font-mono text-[10px] uppercase tracking-wider text-mid mb-3">File OCR</div>
                <div class="placeholder-striped flex-1 flex items-center justify-center">
                  <span class="font-mono text-[10px] uppercase text-mid text-center px-4">Liste des pièces en cours · alimentée Sprint 3</span>
                </div>
              </aside>
            </div>
          </div>

          <!-- ====================================================== -->
          <!-- === SUBVIEW OCR (vortex loader plein écran) ========== -->
          <!-- ====================================================== -->
          <div x-show="subview === 'ocr'" x-cloak
               class="fixed inset-0 z-40 flex items-center justify-center"
               style="background-color: #0b0a14;">

            <!-- Anneaux concentriques (4) -->
            <div class="absolute inset-0 flex items-center justify-center">
              <div class="absolute w-[420px] h-[420px] rounded-full border-[2px] vortex-spin-5s"
                   style="border-color: rgba(255,31,109,0.20); border-top-color: transparent;"></div>
              <div class="absolute w-[320px] h-[320px] rounded-full border-[2px] vortex-spin-4s-rev"
                   style="border-color: rgba(255,31,109,0.35); border-top-color: transparent;"></div>
              <div class="absolute w-[220px] h-[220px] rounded-full border-[2px] vortex-spin-3s"
                   style="border-color: rgba(255,31,109,0.55); border-top-color: transparent;"></div>
              <div class="absolute w-[140px] h-[140px] rounded-full border-[2px] vortex-spin-4s-rev"
                   style="border-color: rgba(139,61,255,0.70); border-top-color: transparent;"></div>
            </div>

            <!-- Document avalé -->
            <div class="vortex-doc relative z-10 w-[80px] h-[110px] bg-paper rounded-sm p-3">
              <div class="h-2 bg-ink mb-2"></div>
              <div class="h-[3px] bg-mid mb-1"></div>
              <div class="h-[3px] bg-mid mb-1"></div>
              <div class="h-[3px] bg-mid mb-1 w-2/3"></div>
              <div class="h-[3px] bg-mid mb-1"></div>
              <div class="h-[3px] bg-mid mb-1 w-1/2"></div>
            </div>

            <!-- Texte + timer + barre progression -->
            <div class="absolute bottom-20 left-1/2 -translate-x-1/2 text-center text-white w-[80%] max-w-md">
              <div class="font-display font-black text-3xl md:text-5xl uppercase leading-none mb-2">GALACTUS</div>
              <div class="font-mono text-xs uppercase tracking-widest text-gold mb-4">… avale la facture</div>
              <div class="font-mono text-sm text-accent mb-3">OCR · <span x-text="ocrTimeLabel()"></span></div>
              <div class="ocr-progress-bar w-full"></div>
            </div>
          </div>

          <!-- ====================================================== -->
          <!-- === SUBVIEW VALIDATION =============================== -->
          <!-- ====================================================== -->
          <div x-show="subview === 'validation'" x-cloak class="md:flex md:min-h-[calc(100vh-80px)]">

            <!-- ============== PREVIEW (gauche desktop, top mobile) ============== -->
            <div class="bg-soft p-5 md:p-6 md:w-1/2 md:flex md:flex-col">
              <div class="flex items-center justify-between mb-3">
                <div class="font-mono text-[10px] uppercase tracking-wider text-mid">Aperçu</div>
                <span class="badge"
                      :class="globalConfidencePct() >= 80 ? 'badge-conf-high' : globalConfidencePct() >= 50 ? 'badge-conf-mid' : 'badge-conf-low'"
                      x-text="`OCR ${globalConfidencePct()}%`"></span>
              </div>

              <!-- Pagination si > 1 page -->
              <div x-show="pages.length > 1" class="flex items-center justify-center gap-3 mb-3">
                <button @click="prevPreviewPage()" :disabled="currentPreviewPage === 0"
                        class="font-mono text-xs uppercase border-[1.5px] border-ink rounded px-3 py-1 disabled:opacity-30">←</button>
                <span class="font-mono text-[11px] uppercase tracking-wider text-mid">
                  Page <span x-text="currentPreviewPage + 1"></span> / <span x-text="pages.length"></span>
                </span>
                <button @click="nextPreviewPage()" :disabled="currentPreviewPage === pages.length - 1"
                        class="font-mono text-xs uppercase border-[1.5px] border-ink rounded px-3 py-1 disabled:opacity-30">→</button>
              </div>

              <!-- Image ou PDF preview -->
              <div class="border border-rule rounded bg-paper flex-1 flex items-center justify-center overflow-hidden min-h-[200px] md:min-h-[400px]">
                <template x-if="pages[currentPreviewPage] && pages[currentPreviewPage].mediaType !== 'application/pdf'">
                  <img :src="pages[currentPreviewPage].previewUrl" class="max-w-full max-h-full object-contain" />
                </template>
                <template x-if="pages[currentPreviewPage] && pages[currentPreviewPage].mediaType === 'application/pdf'">
                  <embed :src="pages[currentPreviewPage].previewUrl" type="application/pdf" class="w-full h-full min-h-[400px]" />
                </template>
              </div>
            </div>

            <!-- ============== FORMULAIRE (droite desktop, bas mobile) ============== -->
            <div class="p-5 md:p-6 md:w-1/2 md:overflow-y-auto">
              <header class="mb-5">
                <button @click="subview = 'home'"
                        class="font-mono text-[11px] uppercase tracking-wider text-mid mb-2 hover:text-ink">← Retour</button>
                <h1 class="font-display font-black text-3xl md:text-4xl uppercase">Valider la pièce</h1>
              </header>

              <div class="flex flex-col gap-4">

                <!-- Date -->
                <div class="flex flex-col gap-1">
                  <label class="text-[11px] font-mono uppercase tracking-wider text-mid flex items-center gap-2">
                    Date <span class="text-[9px] text-faint" x-text="`OCR ${confidencePct('date')}%`"></span>
                  </label>
                  <input type="date" x-model="formData.date_piece"
                         :class="confidenceClass('date')"
                         class="border border-ink rounded-sm px-3 py-2 font-mono text-sm bg-paper focus:outline-none focus:border-accent" />
                </div>

                <!-- Fournisseur + slug auto -->
                <div class="flex flex-col gap-1">
                  <label class="text-[11px] font-mono uppercase tracking-wider text-mid flex items-center gap-2">
                    Fournisseur <span class="text-[9px] text-faint" x-text="`OCR ${confidencePct('fournisseur')}%`"></span>
                  </label>
                  <input type="text" x-model="formData.fournisseur" @input="onFournisseurInput()"
                         :class="confidenceClass('fournisseur')"
                         class="border border-ink rounded-sm px-3 py-2 font-mono text-sm bg-paper focus:outline-none focus:border-accent" />
                  <span class="font-mono text-[10px] text-faint" x-text="formData.fournisseur_slug ? `→ ${formData.fournisseur_slug}` : ''"></span>
                </div>

                <!-- Catégorie -->
                <div class="flex flex-col gap-2">
                  <label class="text-[11px] font-mono uppercase tracking-wider text-mid flex items-center gap-2">
                    Catégorie <span class="text-[9px] text-faint" x-text="`OCR ${confidencePct('categorie')}%`"></span>
                  </label>
                  <div class="flex flex-wrap gap-2">
                    <template x-for="c in ['fournisseur', 'ndf', 'materiel', 'vente']" :key="c">
                      <span class="chip-ingest" :class="formData.categorie === c ? 'chip-on' : ''"
                            @click="selectCategorie(c)" x-text="c"></span>
                    </template>
                  </div>
                </div>

                <!-- Activité -->
                <div class="flex flex-col gap-2">
                  <label class="text-[11px] font-mono uppercase tracking-wider text-mid flex items-center gap-2">
                    Activité <span class="text-[9px] text-faint" x-text="`OCR ${confidencePct('activite')}%`"></span>
                  </label>
                  <div class="flex flex-wrap gap-2">
                    <template x-for="a in ['TDM', 'VUM', 'MIX']" :key="a">
                      <span class="chip-ingest" :class="formData.activite === a ? 'chip-on' : ''"
                            @click="selectActivite(a)" x-text="a"></span>
                    </template>
                  </div>
                </div>

                <!-- Montants HT/TVA/TTC -->
                <div class="grid grid-cols-3 gap-3">
                  <div class="flex flex-col gap-1">
                    <label class="text-[11px] font-mono uppercase tracking-wider text-mid">HT €</label>
                    <input type="number" step="0.01" x-model.number="formData.montant_ht"
                           @blur="recalcMontants('ht')"
                           :class="confidenceClass('montant')"
                           class="border border-ink rounded-sm px-2 py-2 font-mono text-sm bg-paper focus:outline-none focus:border-accent" />
                  </div>
                  <div class="flex flex-col gap-1">
                    <label class="text-[11px] font-mono uppercase tracking-wider text-mid">TVA €</label>
                    <input type="number" step="0.01" x-model.number="formData.montant_tva"
                           @blur="recalcMontants('tva')"
                           :class="confidenceClass('montant')"
                           class="border border-ink rounded-sm px-2 py-2 font-mono text-sm bg-paper focus:outline-none focus:border-accent" />
                  </div>
                  <div class="flex flex-col gap-1">
                    <label class="text-[11px] font-mono uppercase tracking-wider text-mid">TTC €</label>
                    <input type="number" step="0.01" x-model.number="formData.montant_ttc"
                           @blur="recalcMontants('ttc')"
                           :class="confidenceClass('montant')"
                           class="border border-ink rounded-sm px-2 py-2 font-mono text-sm bg-paper focus:outline-none focus:border-accent" />
                  </div>
                </div>

                <!-- Taux TVA -->
                <div class="grid grid-cols-2 gap-3">
                  <div class="flex flex-col gap-1">
                    <label class="text-[11px] font-mono uppercase tracking-wider text-mid">Taux TVA</label>
                    <select :value="formData.taux_tva_choice" @change="onTauxTvaChoice($event.target.value)"
                            class="border border-ink rounded-sm px-2 py-2 font-mono text-sm bg-paper focus:outline-none focus:border-accent">
                      <option value="20">20 %</option>
                      <option value="10">10 %</option>
                      <option value="5.5">5,5 %</option>
                      <option value="0">0 %</option>
                      <option value="autre">Autre…</option>
                    </select>
                  </div>
                  <div class="flex flex-col gap-1" x-show="formData.taux_tva_choice === 'autre'">
                    <label class="text-[11px] font-mono uppercase tracking-wider text-mid">Taux personnalisé</label>
                    <input type="number" step="0.01"
                           :value="formData.taux_tva"
                           @input="onTauxTvaAutreInput($event.target.value)"
                           class="border border-ink rounded-sm px-2 py-2 font-mono text-sm bg-paper focus:outline-none focus:border-accent" />
                  </div>
                </div>

                <!-- Référence (optionnel) -->
                <div class="flex flex-col gap-1">
                  <label class="text-[11px] font-mono uppercase tracking-wider text-mid">Référence fournisseur (optionnel)</label>
                  <input type="text" x-model="formData.reference_fournisseur"
                         class="border-[1.5px] border-ink rounded-sm px-3 py-2 font-mono text-sm bg-paper focus:outline-none focus:border-accent" />
                </div>

                <!-- Description (optionnel) -->
                <div class="flex flex-col gap-1">
                  <label class="text-[11px] font-mono uppercase tracking-wider text-mid">Description (optionnel)</label>
                  <textarea x-model="formData.description" rows="2"
                            class="border-[1.5px] border-ink rounded-sm px-3 py-2 font-mono text-sm bg-paper focus:outline-none focus:border-accent"></textarea>
                </div>

                <!-- FilenamePreview -->
                <div class="filename-preview mt-2">
                  <div class="text-[10px] uppercase tracking-wider text-accent font-bold mb-2">Nom de fichier final</div>
                  <div>
                    <span :class="filenameSegments().dateEmpty ? 'seg-empty' : 'seg-date'" x-text="filenameSegments().date"></span>_<span :class="filenameSegments().vendorEmpty ? 'seg-empty' : 'seg-vendor'" x-text="filenameSegments().vendor"></span>_<span :class="filenameSegments().montantEmpty ? 'seg-empty' : 'seg-amount'" x-text="filenameSegments().montant"></span>_<span :class="filenameSegments().catEmpty ? 'seg-empty' : 'seg-cat'" x-text="filenameSegments().cat"></span>_<span :class="filenameSegments().actEmpty ? 'seg-empty' : 'seg-act'" x-text="filenameSegments().act"></span>.pdf
                  </div>
                </div>

                <!-- Boutons -->
                <div class="flex flex-col md:flex-row gap-2 mt-4">
                  <button @click="validateAndSave({continueRafale: true})"
                          :disabled="busy || !canValidate()"
                          class="flex-1 bg-gradient-to-b from-hot to-accent text-white border-[1.5px] border-ink rounded px-4 py-3 font-bold uppercase tracking-wider text-sm shadow-glow-accent disabled:opacity-50 disabled:cursor-not-allowed">
                    <span x-show="!busy">Valider et suivante →</span>
                    <span x-show="busy">Enregistrement…</span>
                  </button>
                  <button @click="validateAndSave({continueRafale: false})"
                          :disabled="busy || !canValidate()"
                          class="border-[1.5px] border-ink text-ink rounded px-4 py-3 font-bold uppercase tracking-wider text-sm disabled:opacity-50 disabled:cursor-not-allowed">
                    Valider et terminer
                  </button>
                  <button @click="exitRafale(); resetForm(); subview = 'home';"
                          :disabled="busy"
                          class="border-[1.5px] border-rule text-mid rounded px-4 py-3 font-bold uppercase tracking-wider text-sm hover:text-ink disabled:opacity-50">
                    Annuler
                  </button>
                </div>

              </div>
            </div>
          </div>

          <!-- ====================================================== -->
          <!-- === MODAL DOUBLON ==================================== -->
          <!-- ====================================================== -->
          <div x-show="doublon.open" x-cloak class="modal-backdrop flex items-end md:items-center justify-center">
            <div class="bg-paper border-2 border-ink rounded-t-xl md:rounded-lg p-6 w-full max-w-[720px] mx-auto md:mx-4">
              <div class="flex items-center justify-between mb-4">
                <div class="font-display font-black text-2xl uppercase">⚠️ Doublon détecté</div>
                <button @click="closeDoublon()" class="text-mid hover:text-ink text-xl leading-none">×</button>
              </div>

              <p class="text-sm mb-4">Cette pièce semble déjà avoir été ingérée. Voici l'existante :</p>

              <div class="border-[1.5px] border-amber bg-yellow/20 rounded p-4 mb-4">
                <div class="flex items-center gap-2 mb-2" x-show="doublon.existing">
                  <span class="badge" :class="`badge-cat-${doublon.existing?.categorie}`" x-text="doublon.existing?.categorie"></span>
                  <span class="badge" :class="`badge-act-${doublon.existing?.activite?.toLowerCase()}`" x-text="doublon.existing?.activite"></span>
                  <span class="badge" :class="`badge-status-${doublon.existing?.statut}`" x-text="doublon.existing?.statut?.replace(/_/g, ' ')"></span>
                </div>
                <div class="font-bold text-lg" x-text="doublon.existing?.fournisseur || '—'"></div>
                <div class="font-mono text-sm text-mid mt-1" x-text="formatExistingInfo()"></div>
                <div class="font-mono text-xs text-mid mt-1" x-show="doublon.existing?.reference_fournisseur"
                     x-text="`Réf : ${doublon.existing?.reference_fournisseur}`"></div>
              </div>

              <div class="flex flex-col md:flex-row gap-2">
                <button @click="if (window.Alpine?.store) window.Alpine.store('app').piecesPrefilter = { recherche: doublon.existing?.fournisseur || '' }; closeDoublon(); resetForm(); subview = 'home'; location.hash = '#/pieces';"
                        class="flex-1 border-[1.5px] border-ink text-ink rounded px-4 py-3 font-bold uppercase tracking-wider text-xs hover:bg-soft">
                  Voir dans Pièces
                </button>
                <button @click="closeDoublon(); resetForm(); subview = 'home';"
                        class="flex-1 border-[1.5px] border-ink text-ink rounded px-4 py-3 font-bold uppercase tracking-wider text-xs">
                  Annuler
                </button>
                <button disabled
                        title="Disponible Sprint 3 (gestion collisions hash)"
                        class="flex-1 bg-faint text-paper border-[1.5px] border-faint rounded px-4 py-3 font-bold uppercase tracking-wider text-xs opacity-60 cursor-not-allowed">
                  Créer quand même (Sprint 3)
                </button>
              </div>
            </div>
          </div>

          <!-- ====================================================== -->
          <!-- === MODAL MULTI-DROP (drop multi-fichiers desktop) ==== -->
          <!-- ====================================================== -->
          <div x-show="multiDrop.open" x-cloak class="modal-backdrop flex items-center justify-center">
            <div class="bg-paper border-2 border-ink rounded-lg p-6 w-full max-w-[480px] mx-4">
              <div class="font-display font-black text-2xl uppercase mb-3">Multi-fichiers détectés</div>
              <p class="text-sm mb-5">
                Tu as déposé <span class="font-bold" x-text="multiDrop.files.length"></span> fichiers. Ce sont :
              </p>
              <div class="flex flex-col gap-2">
                <button @click="chooseMultiDropMode('same')"
                        class="bg-gradient-to-b from-hot to-accent text-white border-[1.5px] border-ink rounded px-4 py-3 font-bold uppercase tracking-wider text-xs shadow-glow-accent">
                  Les pages d'UNE même pièce
                </button>
                <button @click="chooseMultiDropMode('separate')"
                        class="border-[1.5px] border-ink text-ink rounded px-4 py-3 font-bold uppercase tracking-wider text-xs">
                  Plusieurs pièces séparées
                </button>
                <button @click="multiDrop.open = false; multiDrop.files = [];"
                        class="text-mid hover:text-ink font-mono text-[11px] uppercase tracking-wider mt-2">Annuler</button>
              </div>
              <p class="font-mono text-[10px] uppercase tracking-wider text-amber mt-4">
                ⚠ Sprint 2 : "pièces séparées" traite la 1ʳᵉ uniquement
              </p>
            </div>
          </div>

        </section>
      </template>

      <!-- =================== VUE DASHBOARD (Sprint 3) =================== -->
      <template x-if="currentView === 'dashboard'">
        <section x-data="dashboard()" x-init="init()" class="p-5 md:p-8 max-w-6xl">
          <header class="mb-6">
            <h1 class="font-display font-black text-4xl md:text-5xl uppercase">DASHBOARD</h1>
            <p class="font-mono text-[11px] uppercase tracking-wider text-mid mt-1" x-text="moisLabel"></p>
          </header>

          <div x-show="loading" class="placeholder-striped h-64 flex items-center justify-center">
            <span class="font-mono text-mid uppercase text-sm">Calcul des KPI…</span>
          </div>

          <div x-show="!loading && data" x-cloak class="flex flex-col gap-6">

            <!-- ============== BANNIÈRE TVA + PRÉ-CA3 ============== -->
            <div class="nebula-gradient rounded-lg p-5 md:p-6 relative overflow-hidden">
              <div class="absolute inset-0 star-field opacity-40 pointer-events-none"></div>
              <div class="relative">
                <div class="font-mono text-[10px] uppercase tracking-widest text-gold mb-3">TVA du mois · Pré-CA3 — estimation (Indy tranche)</div>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-white">
                  <div>
                    <div class="font-mono text-[10px] uppercase text-faint">Collectée</div>
                    <div class="kpi-value text-3xl md:text-4xl text-white" x-text="fmt(data.tva.collectee)"></div>
                  </div>
                  <div>
                    <div class="font-mono text-[10px] uppercase text-faint">Déductible</div>
                    <div class="kpi-value text-3xl md:text-4xl text-white" x-text="fmt(data.tva.deductible)"></div>
                  </div>
                  <div>
                    <div class="font-mono text-[10px] uppercase text-faint">Solde estimé</div>
                    <div class="kpi-value text-3xl md:text-4xl" :class="data.tva.solde >= 0 ? 'text-green' : 'text-accent-soft'" x-text="fmt(data.tva.solde)"></div>
                  </div>
                  <div>
                    <div class="font-mono text-[10px] uppercase text-faint">Ventilation déductible</div>
                    <div class="font-mono text-[11px] mt-1 leading-relaxed">
                      <div>TDM <span class="text-gold" x-text="fmt(data.tva.deductibleTdm)"></span></div>
                      <div>VUM <span class="text-gold" x-text="fmt(data.tva.deductibleVum)"></span></div>
                      <div>MIX <span class="text-cyan" x-text="fmt(data.tva.deductibleMix)"></span> <span class="text-faint">(à ventiler)</span></div>
                    </div>
                  </div>
                </div>
                <div x-show="data.tva.aucunNdfMois" class="font-mono text-[9px] uppercase tracking-wider text-faint mt-3">
                  Déductible = Σ TVA des pièces du mois (aucune consolidation NDF avant Sprint 4)
                </div>
              </div>
            </div>

            <!-- ============== 5 KPI CARDS ============== -->
            <div class="grid grid-cols-2 md:grid-cols-5 gap-3 md:gap-4">
              <button @click="goPiecesFiltre({categories:['vente']})"
                      class="text-left border-[1.5px] border-gold rounded-md p-4 bg-gold/10 hover:bg-gold/20 transition-colors">
                <div class="font-mono text-[10px] uppercase tracking-wider text-mid">CA cumulé 2026</div>
                <div class="kpi-value text-3xl md:text-4xl mt-1" x-text="fmt(data.kpi.caYtd)"></div>
                <div class="font-mono text-[10px] text-amber mt-1">dont mois <span x-text="fmt(data.kpi.caMois)"></span></div>
              </button>

              <button @click="goPiecesFiltre({activites:['TDM']})"
                      class="text-left border border-rule rounded-md p-4 bg-paper hover:bg-soft transition-colors">
                <div class="font-mono text-[10px] uppercase tracking-wider text-mid">Dépenses TDM</div>
                <div class="kpi-value text-3xl md:text-4xl mt-1" x-text="fmt(data.kpi.depTdm)"></div>
                <div class="font-mono text-[10px] mt-1" :class="deltaClass(data.kpi.depTdmDelta)" x-text="deltaLabel(data.kpi.depTdmDelta) + ' vs M-1'"></div>
              </button>

              <button @click="goPiecesFiltre({activites:['VUM']})"
                      class="text-left border border-rule rounded-md p-4 bg-paper hover:bg-soft transition-colors">
                <div class="font-mono text-[10px] uppercase tracking-wider text-mid">Dépenses VUM</div>
                <div class="kpi-value text-3xl md:text-4xl mt-1" x-text="fmt(data.kpi.depVum)"></div>
                <div class="font-mono text-[10px] mt-1" :class="deltaClass(data.kpi.depVumDelta)" x-text="deltaLabel(data.kpi.depVumDelta) + ' vs M-1'"></div>
              </button>

              <button @click="goExports()"
                      class="text-left rounded-md p-4 bg-paper border-[1.5px] transition-colors"
                      :class="data.kpi.aUploader > 5 ? 'border-accent hover:bg-accent/5' : 'border-ink hover:bg-soft'">
                <div class="font-mono text-[10px] uppercase tracking-wider text-mid">À uploader Indy</div>
                <div class="kpi-value text-3xl md:text-4xl mt-1" :class="data.kpi.aUploader > 5 ? 'text-accent' : ''" x-text="data.kpi.aUploader"></div>
                <div class="font-mono text-[10px] text-mid mt-1">→ Exports</div>
              </button>

              <button @click="goPiecesFiltre({categories:['ndf']})"
                      class="text-left border border-rule rounded-md p-4 bg-paper hover:bg-soft transition-colors">
                <div class="font-mono text-[10px] uppercase tracking-wider text-mid">NDF mois</div>
                <div class="kpi-value text-3xl md:text-4xl mt-1" x-text="fmt(data.kpi.ndfTotal)"></div>
                <div class="font-mono text-[10px] text-mid mt-1"><span x-text="data.kpi.ndfCount"></span> ligne(s) · <span x-text="data.kpi.ndfConsolide ? 'consolidée' : 'en cours'"></span></div>
              </button>
            </div>

            <!-- ============== GRID 2 COLONNES : RÉCURRENTS + GRAPHES ============== -->
            <div class="grid md:grid-cols-2 gap-6">

              <!-- Fournisseurs récurrents -->
              <div>
                <div class="flex items-center justify-between mb-3">
                  <h2 class="font-display font-black text-xl uppercase">Fournisseurs récurrents</h2>
                  <button disabled title="CRUD disponible Sprint 4"
                          class="font-mono text-[9px] uppercase tracking-wider text-faint border border-faint rounded px-2 py-1 opacity-60 cursor-not-allowed">Gérer</button>
                </div>
                <div class="flex flex-col gap-2">
                  <template x-for="a in data.alerts" :key="a.nom">
                    <div class="border-[1.5px] border-rule rounded p-3 bg-paper flex items-center justify-between">
                      <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-gold text-ink font-display font-black flex items-center justify-center text-xs" x-text="a.nom.charAt(0)"></div>
                        <div>
                          <div class="font-bold text-sm" x-text="a.nom"></div>
                          <div class="font-mono text-[9px] uppercase tracking-wider text-mid"><span x-text="a.frequence"></span> · <span x-text="a.activite"></span></div>
                        </div>
                      </div>
                      <div class="flex items-center gap-2">
                        <span x-text="etatIcon(a.etat)"></span>
                        <span class="font-mono text-[9px] uppercase tracking-wider text-mid" x-text="a.label"></span>
                      </div>
                    </div>
                  </template>
                  <div x-show="data.alerts.length === 0" class="font-mono text-[11px] text-faint italic">Aucun fournisseur récurrent.</div>
                </div>
                <div class="font-mono text-[9px] uppercase tracking-wider text-faint mt-2">
                  Alertes dormantes — la date de dernière facture sera câblée à l'ingestion (backlog)
                </div>
              </div>

              <!-- Graphes -->
              <div class="flex flex-col gap-6">
                <div>
                  <h2 class="font-display font-black text-xl uppercase mb-3">Dépenses · 12 mois</h2>
                  <div class="border border-rule rounded-md p-3 bg-paper overflow-x-auto">
